name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PORTAL_MCP_HEADLESS: "1"
      PORTAL_MCP_NO_NOTIFY: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Chromium (Linux, with system libraries)
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: uv run playwright install chromium

      - name: Run tests (Linux, with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -q

      - name: Run tests
        if: runner.os != 'Linux'
        run: uv run pytest -q
